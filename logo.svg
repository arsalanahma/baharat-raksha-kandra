<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brkTricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <linearGradient id="brkShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="brkBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Ring with Tricolor Border -->
  <circle cx="60" cy="60" r="56" fill="#0b1329" stroke="url(#brkTricolor)" stroke-width="3" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#brkGold)" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Protective Heraldic Shield -->
  <path d="M60 16 C84 22, 94 28, 94 54 C94 78, 80 94, 60 105 C40 94, 26 78, 26 54 C26 28, 36 22, 60 16 Z" fill="url(#brkShieldGrad)" stroke="url(#brkGold)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Ashoka Chakra 24-Spoke Wheel Motif -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="21" fill="none" stroke="#0284c7" stroke-width="0.8" />
    <circle cx="0" cy="0" r="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(0)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(15)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(30)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(45)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(60)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(75)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(90)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(105)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(120)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(135)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(150)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(165)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(180)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(195)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(210)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(225)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(240)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(255)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(270)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(285)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(300)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(315)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(330)" />
    <line x1="0" y1="-5" x2="0" y2="-21" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" transform="rotate(345)" />
  </g>

  <!-- Central Emergency Beacon Flame -->
  <g transform="translate(60, 58)">
    <circle cx="0" cy="0" r="9" fill="url(#brkBeaconGlow)" />
    <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.5" fill="#ef4444" />
  </g>

  <!-- Saffron & Green Arcs -->
  <path d="M42 22 Q60 17 78 22" fill="none" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round" />
  <path d="M44 98 Q60 103 76 98" fill="none" stroke="#138808" stroke-width="2.5" stroke-linecap="round" />
</svg>
